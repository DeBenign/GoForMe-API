<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3EFE7"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#FFCE8C"/>
      <stop offset="0.5" stop-color="#F0A93E"/>
      <stop offset="1" stop-color="#C2760F"/>
    </linearGradient>
    <linearGradient id="markDeep" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#F2B45A"/>
      <stop offset="1" stop-color="#9C5A0C"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#9C5A0C" flood-opacity="0.35"/>
    </filter>
    <filter id="tileShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#8A6A3F" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#tile)" filter="url(#tileShadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#EAE3D5" stroke-width="2"/>

  <!-- abstract runner: three ascending motion bars suggesting a stride,
       plus a head dot, reading as a running figure in silhouette-motion form -->
  <g filter="url(#softShadow)">
    <!-- trailing back bar (rear leg push-off) -->
    <rect x="150" y="290" width="150" height="34" rx="17" fill="url(#markDeep)"
          transform="skewY(-14)"/>
    <!-- mid bar (torso lean) -->
    <rect x="196" y="220" width="150" height="38" rx="19" fill="url(#mark)"
          transform="skewY(-14)"/>
    <!-- front bar (leading leg drive) -->
    <rect x="244" y="150" width="150" height="42" rx="21" fill="url(#mark)"
          transform="skewY(-14)"/>
    <!-- head -->
    <circle cx="368" cy="128" r="30" fill="url(#mark)"/>
  </g>

  <!-- motion trail -->
  <g stroke="url(#mark)" stroke-linecap="round" fill="none" opacity="0.4">
    <path d="M112 340 L 168 340" stroke-width="12"/>
    <path d="M98 300 L 170 300" stroke-width="12"/>
  </g>
</svg>
